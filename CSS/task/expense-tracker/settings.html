<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker | Settings</title>
  <link rel="stylesheet" href="style.css">

<body>
  <header><h1>Expense Tracker</h1></header>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="transactions.html">Transactions</a>
    <a href="budgets.html">Budgets</a>
    <a href="reports.html">Reports</a>
    <a class="active" href="settings.html">Settings</a>
  </nav>
  <main>
    <h2>Settings</h2>
    <p>Example profile form for the website design.</p>
    <section class="panel">
      <form>
        <label for="name">Full name</label>
        <input id="name" type="text" value="Your Name">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com">
        <label for="currency">Currency</label>
        <select id="currency">
          <option>Indian Rupee (₹)</option>
          <option>US Dollar ($)</option>
          <option>Euro (€)</option>
        </select>
        <button type="button">Save design only</button>
      </form>
      <p><small>This form is for appearance only. It does not save information.</small></p>
    </section>
  </main>
  <footer>Expense Tracker · HTML and CSS project</footer>
</body>
