<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(236, 224, 224);
            position: relative;
            width:300px;
            height:200px;
            border: 2px solid black;
            padding: 20px;
            
        }
        .box1{
            background-color: orange;
            width: 100px;
            height: 100px;
            position: absolute;
            z-index: 3;
        }

        .box2{
            background-color: rgb(173, 37, 10);
            width: 100px;
            height: 100px;
            position: absolute;
            left:50px;
            top: 50px;
            z-index: 2;
        }
        .box3{
            background-color: rgb(10, 34, 173);
            width: 100px;
            height: 100px;
            position: absolute;
            left:80px;
            top: 80px;
        }

        @media(max_width:600px)
        body{
            font-size:18px
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="box1"> box 1</div>
        <div class="box2"> box 2</div>
        <div class="box3"> box 3</div>
    </div>


</body>
</html>
