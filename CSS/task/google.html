<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Boxes</title>
 
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back,arrow_forward,refresh" />

    <style>
        .header-1 {
            background-color:#1b2d30;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-2 {
            background-color:#273f44;
    
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .Box-h2{
            background-color:#1b2d30;
            width: 2000px;
            height: 10px;
            padding: 15px 20px;
            border-radius: 20px;

        }

        .buttons {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .material-symbols-outlined {
            font-size: 40px;
            color: #78909c;
            cursor: pointer;
        }

        .refresh {
            background-color: #29464d;
            border-radius: 50%;
            padding: 15px;
        }


        .box-2{
            width:auto;
            height: 5000px;
            background-color:#1b2d30;
            padding-top:200px;

        }
        
        .google{
            text-align: center;
            font-size:xxx-large

        }
        .a { color: blue; }
        .b { color: red; }
        .c { color: green; }
        .d { color: orange; }

       .search-bar{
        align: center;
       }
       
       .search-bar {
            align-items: center;
            width: 1000px;
            height: 101px;
            background-color: white;
            border-radius: 55px;

            display: flex;
            align-items: center;
            padding: 0 34px;
            gap: 30px;
        }

                /* Plus */
        .plus {
            font-size: 40px;
            font-weight: 300;
            color: #222;
        }

        /* Search text */
        .search-text {
            flex: 1;
            font-size: 28px;
            color: #aaa;
        }

        /* Right icons */
        .icons {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .mic {
            font-size: 32px;
            color: #222;
        }

        .camera {
            width: 28px;
            height: 20px;
            border: 3px solid #222;
            border-radius: 5px;
            position: relative;
        }

        .camera::before {
            content: "";
            position: absolute;
            width: 9px;
            height: 5px;
            background: #222;
            top: -7px;
            left: 7px;
            border-radius: 3px;
        }

        .camera::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid #222;
            border-radius: 50%;
            left: 7px;
            top: 3px;
        }

        /* Bottom cards */
        .cards {
            display: flex;
            gap: 26px;
            margin: 30px 60px 0;
        }

        .card {
            width: 50%;
            height: 102px;
            background-color: #102f34;
            border-radius: 28px;

            display: flex;
            align-items: center;
            padding: 20px 30px;
        }

        .card-text h2 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #dcecff;
        }

        .card-text p {
            margin: 0;
            font-size: 21px;
            color: #c7d8e8;
        }

    </style>
</head>

<body>
    <header class="header-1">

    </header>

    <header class="header-2">
        <div class="buttons"> 
        <!-- Back -->
        <span class="material-symbols-outlined">
            arrow_back
        </span>

        <!-- Forward -->
        <span class="material-symbols-outlined">
            arrow_forward
        </span>

        <!-- Refresh -->
        <span class="material-symbols-outlined refresh">
            refresh
        </span>
        </div>
        <div class="Box-h2">

        </div>

    </header>

    
    <div class="box-2">

        <div class="google">
        <h1>
        <span class="a">G</span>
        <span class="b">o</span>
        <span class="c">o</span>
        <span class="d">g</span>
        <span class="a">l</span>
        <span class="b">e</span>
        </h1>
        </div>

        <div class="search-bar">

            <div class="plus">+</div>
            <div class="search-text">
                Ask Google
            </div>

            <div class="icons">
                <div class="mic">♩</div>
                <div class="camera"></div>
            </div>
             <!-- Bottom Cards -->
    <div class="cards">

        <div class="card">
            <div class="card-text">
                <h2>Do more with AI Mode</h2>
                <p>Create, summarize, plan</p>
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Create images</h2>
                <p>Reimagine, illustrate, edit</p>
            </div>
        </div>

    </div>

        
        </div>


    </div>

</body>
</html>
