<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>

    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1b2d30;
        }

        .header-1 {
            height:20px;
            background-color: #1b2d30;
        }

        .header-2 {
            height: 82px;
            background-color: #273f44;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 30px;
        }



        .buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .material-symbols-outlined {
            font-size: 32px;
            color: #78909c;
        }

        .refresh {
            background-color: #29464d;
            border-radius: 50%;
            padding: 10px;
        }



        .Box-h2 {
            background-color: #1b3033;
            height: 34px;
            flex: 1;
            border-radius: 20px;
        }

        .box-2 {
            background-color: #1b2d30;
            padding-top: 210px;
        }



        .google {
            text-align: center;
            margin-bottom: 40px;
        }

        .google h1 {
            font-family: Georgia, serif;
            font-size: 76px;
            letter-spacing: 8px;
        }

        .a { color: blue; }
        .b { color: red; }
        .c { color: green; }
        .d { color: orange; }

        .search-section {
            width: 860px;
            margin: auto;
        }

        .search-bar {
            background-color: white;
            height: 82px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 25px;
        }



        .plus {
            font-size: 30px;
            color: #333;
        }

        .search-text {
            font-size: 20px;
            color: #999;
            flex: 1;
        }

        .icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icons .material-symbols-outlined {
            color: #222;
            font-size: 28px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            width: 230px;
            height: 112px;
            background-color: #102f34;
            border-radius: 24px;
            padding: 22px 24px;
        }

        .card h2 {
            font-size: 17px;
            color: #dcecff;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: #c7d8e8;
        }
    </style>
</head>

<body>

    <header class="header-1"></header>

    <header class="header-2">

        <div class="buttons">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="material-symbols-outlined">arrow_forward</span>
            <span class="material-symbols-outlined refresh">refresh</span>
        </div>

        <div class="Box-h2"></div>

    </header>

    <main class="box-2">

        <div class="google">
            <h1>
                <span class="a">G</span><span class="b">o</span><span class="c">o</span><span class="d">g</span><span class="a">l</span><span class="b">e</span>
            </h1>
        </div>

        <section class="search-section">

            <div class="search-bar">

                <div class="plus">+</div>

                <div class="search-text">
                    Enter to search
                </div>

                <div class="icons">
                    <span class="material-symbols-outlined">mic</span>
                    <span class="material-symbols-outlined">photo_camera</span>
                </div>

            </div>

            <div class="cards">

                <div class="card">
                    <h2>Do more with AI</h2>
                    <p>Create, summarize, plan</p>
                </div>

                <div class="card">
                    <h2>Create images</h2>
                    <p>Reimagine, illustrate, edit</p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
