<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: rgb(255, 254, 254);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            background-color: black;
        }

    </style>
</head>

<body>

    <header>
        <div class="nav-links">
            <a>Home</a>
            <a>About Us</a>
            <a>Contact Us</a>
        </div>

    </header>

</body>
</html>
