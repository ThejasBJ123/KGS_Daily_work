
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Animation</title>

    <style>
        
        .a{
            display: flex;
        }
        body{
            background-color: aliceblue;
        }
        .box {
            height: 100px;
            width: 100px;
            margin: 100px;
            background-color: blueviolet;

            animation: movebox 3s cubic-bezier(1, 0, 0, 1) infinite alternate;
        }
        .box1 {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
           
        }
        @keyframes movebox {
            0% {
                background-color: orange;
                transform: translateX(0) rotate(0deg);
                border-radius: 0;
            }

            50% {
                background-color: rgb(25, 2, 104);
                transform: translateY(200px) rotate(360deg);
                border-radius: 25px;

            }
            70% {
                background-color: rgb(136, 111, 9);
                transform: translateY(300px) rotate(120deg);
                border-radius: 25px;
                
            }

            100% {
                background-color: rgb(83, 162, 4);
                transform: translateZ(400px) rotate(180deg);
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="a">
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box"></div>
    <div class="box1"></div>
    
    </div>

</body>
</html>
