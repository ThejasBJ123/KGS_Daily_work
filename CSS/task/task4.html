<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>

        header {
            background-color: #0c0808;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }




        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            <h1>NavBar</h1>
        </div>

        <div class="nav-links">
            <a>Home</a>
            <a>About Us</a>
            <a>Contact Us</a>
        </div>
         <!-- Bottom Cards -->
    <div class="cards">

        <div class="card">
            <div class="card-text">
                <h2>Do more with AI Mode</h2>
                <p>Create, summarize, plan</p>
            </div>
        </div>

        <div class="card">
            <div class="card-text">
                <h2>Create images</h2>
                <p>Reimagine, illustrate, edit</p>
            </div>
        </div>

    </div>


    </header>

</body>
</html>
