<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: black;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10 30px;

        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
        }

        .buttons {
            display: flex;
            gap: 30px;
            padding:20px
        }

        .buttons a {
            text-decoration: none;
            color: white;
            font-size: 16px;
        }

        .buttons a:hover {
            cursor: pointer;
            border:2px solid black;
            color: white;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="logo">
            <a>Webpage</a>
        </div>

        <div class="buttons">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Services</a>
            <a href="#">Contact Us</a>
        </div>

    </div>

</body>
</html>
