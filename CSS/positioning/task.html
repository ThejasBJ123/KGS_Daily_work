
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background-color: antiquewhite;
        }

        .logo {
            background-color: rgb(4, 4, 92);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .buttons a {
            color: rgb(4, 4, 92);
            font-size: 16px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="logo">My Portfolio</div>

        <div class="buttons">
            <a >Home</a>
            <a >About</a>
            <a >Projects</a>
            <a >Contact</a>
        </div>

    </div>

</body>
</html>
