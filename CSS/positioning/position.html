<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container {
        width: 350px;
        height: 400px;
        background-color: beige;
        border: 2px solid black;
        position: absolute;
    }

    .box1 {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        border: 2px solid black;
        position: absolute;
        left: 10px;
        top: 60px;
    }

    .box2 {
        width: 100px;
        height: 100px;
        background-color: rgb(85, 10, 138);
        border: 2px solid black;
        position: absolute;
        left: 80px;
        top: 10px;
    }

    .box3 {
        width: 100px;
        height: 100px;
        background-color: rgb(197, 197, 3);
        border: 2px solid black;
        position: absolute;
        left: 140px;
        top: 60px;
    }
</style>
</head>
<body>
    <div class ="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
    </div>
</body>
</html>
