
    <!-- selector are used to select the elements in the html
     -->

    <!-- 1. simple selector 
     2. Grouping selector
     3. universal selector
     4. id selector
     5. class selector
    6. pseudo selector    -->
    
    <!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* 1. Simple Selector */
        p {
            color: blue;
        }

        /* 2. Grouping Selector */
        h1, h2 {
            color: green;
        }

        /* 3. Universal Selector */
        * {
            font-family: Arial;
        }

        /* 4. ID Selector */
        #name {
            color: red;
        }

        /* 5. Class Selector */
        .box {
            background-color: yellow;
        }

        /* 6. Pseudo Selector */
        button:hover {
            background-color: rgb(9, 3, 124);
            color: rgb(246, 112, 112);
            border-radius: 300px;

        }

    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Example</h2>

    <p>Hello World</p>

    <p id="name">Thejas</p>

    <div class="box">
        This is a box
    </div>

    <br>

    <button>Click Me</button>

</body>
</html>
