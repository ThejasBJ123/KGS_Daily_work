<!-- css color property
 1. built-in Colurs
 2. RGB
 3. RGBA
 4. HEX ( Hexadecimal notation)
 5. HSL
 6. HSLA
  -->
<!DOCTYPE html>
<html>
<head>
    <style>

        /* 1. Built-in Color */
        h1 {
            color: red;
        }

        /* 2. RGB */
        p {
            color: rgb(0, 0, 255);
        }

        /* 3. RGBA */
        h2 {
            color: rgba(255, 0, 0, 0.5);
        }

        /* 4. HEX */
        h3 {
            color: #008000;
        }

        /* 5. HSL */
        h4 {
            color: hsl(240, 100%, 50%);
        }

        /* 6. HSLA */
        h5 {
            color: hsla(0, 100%, 50%, 0.5);
        }

    </style>
</head>

<body>

    <h1>Red</h1>
    <p>Blue</p>
    <h2>Red with Transparency</h2>
    <h3>Green</h3>
    <h4>Blue</h4>
    <h5>Red with Transparency</h5>

</body>
</html>
